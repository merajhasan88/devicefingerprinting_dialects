# Codemagic CI - iOS build for the Device Trust client.
#
# Why this is configured the way it is:
#
#   * UNSIGNED. Codemagic's stock iOS workflows assume TestFlight distribution
#     and therefore demand Apple signing certificates and a paid Apple
#     Developer account. We do not need either: the target is a
#     checkm8-jailbroken device, where AMFI signature enforcement is bypassed
#     and an unsigned app installs directly. `--no-codesign` keeps the whole
#     path free of Apple account requirements.
#
#   * MANUAL .ipa PACKAGING. `flutter build ipa` requires signing, so it cannot
#     be used here. `flutter build ios --no-codesign` emits Runner.app instead,
#     which is not installable as-is. An .ipa is just a zip with the bundle
#     under Payload/, so we assemble it ourselves.
#
#   * MANUAL TRIGGER ONLY. No `triggering:` block, so pushes do not start
#     builds. The free tier is 500 macOS minutes/month and an iOS build costs
#     10-20 of them; automatic builds on every push would burn that quickly.
#
#   * API_BASE_URL IS A STABLE DNS NAME as of 2026-09-16, and no longer an IP.
#     The instance has no Elastic IP by design, so its public address changes on
#     every start, and this value is compiled in -- which used to mean a rebuild
#     every session. A free DuckDNS name plus a boot-time updater on the
#     instance turns that into a DNS record update, at no cost. This line should
#     now change only when the deployment does.
#
#   * It is PINNED HERE, deliberately, rather than set in the
#     Codemagic UI. Codemagic requires every UI environment variable to belong
#     to a group, and a group is only visible to a workflow that declares it
#     under `environment: groups:`. The precedence between an imported group
#     and an inline `vars:` entry of the same name is undocumented, so the UI
#     route is ambiguous as well as easy to get wrong. Pinning the value in the
#     repo removes both problems, and since the server's public IP changes on
#     every EC2 restart (no Elastic IP, by design), the commit history becomes
#     the record of which server a given .ipa was built against.

workflows:
  ios-unsigned:
    name: iOS unsigned build (jailbroken-device target)
    instance_type: mac_mini_m2       # the machine the free tier provides
    max_build_duration: 45

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        # The EC2 test server's current public IP as a nip.io hostname, for
        # which Caddy holds a Let's Encrypt certificate. Update this and commit
        # whenever the instance is restarted. The Dart client fails loudly with
        # api_base_url_missing if it is empty, so it must be set at compile
        # time even for a smoke test.
        API_BASE_URL: "https://devicefingerprinting.duckdns.org"

    scripts:
      - name: Flutter version in use
        script: |
          flutter --version

      - name: Fetch packages
        script: |
          flutter pub get

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package Runner.app into an unsigned .ipa
        script: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "Runner.app not found at $APP"; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../../devicetrust-unsigned.ipa Payload
          cd ../..
          ls -lh devicetrust-unsigned.ipa

      - name: Report what the build produced
        script: |
          echo "--- app bundle ---"
          ls -1 build/ios/iphoneos/Runner.app | head -20
          echo "--- minimum OS the binary declares ---"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" \
            build/ios/iphoneos/Runner.app/Info.plist || true

    # The .ipa this produces must be run through
    # tools/presign_trollstore_ipa.sh before it is handed to TrollStore.
    # Without that step TrollStore applies its own entitlements, which include
    # get-task-allow, and every measurement from the device silently regains a
    # permanent +35 floor. See DESIGN.md 37.
    artifacts:
      - devicetrust-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log

# Codemagic CI - unsigned iOS build of the .NET device-trust harness.
#
# This is the .NET counterpart of the Flutter client's workflow, and it lives on
# a separate branch of the same repository so both can share one Codemagic
# connection. Read the Flutter one first if you have not: the reasoning about
# unsigned builds, manual .ipa packaging and manual triggering applies here
# unchanged, and is not repeated.
#
# What differs from the Flutter workflow, and why:
#
#   * NO API_BASE_URL. The Flutter client takes its endpoint at compile time via
#     --dart-define, so its .ipa is pinned to one server and has to be rebuilt
#     whenever the EC2 instance restarts and its public IP changes. This harness
#     takes the endpoint from a text field on screen and remembers it in
#     NSUserDefaults, so one build survives every IP change. That matters here:
#     a rebuild costs 10-20 of the 500 free macOS minutes per month, shared with
#     the Flutter side.
#
#   * .NET IS INSTALLED BY THE BUILD. Codemagic's macOS images carry Xcode and
#     Flutter, not necessarily the .NET SDK or its ios workload, so both are
#     installed here. Pinning the SDK version keeps a build reproducible rather
#     than tracking whatever is current.
#
#   * .NET 9, NOT 8 OR 10. The iOS bindings are versioned against Xcode, and the
#     image's Xcode is whatever `latest` resolves to. .NET 8's newest iOS
#     bindings are the iOS 18 family, which a current Xcode has moved past;
#     .NET 10's are the iOS 26 family and cannot be compile-checked on the Linux
#     workstation this was written on, because a net9.0 build referencing a
#     net10.0 assembly fails with CS1705, an error rather than a waivable
#     warning. .NET 9 has iOS 26 bindings AND is checkable here, so these exact
#     sources were built against both Microsoft.iOS.Ref.net9.0_26.0 and _26.5
#     before this workflow ran. Building what has been checked is worth more
#     than building the newest runtime when the alternative verification costs
#     shared macOS minutes.
#
#     If Xcode moves far enough that .NET 9 can no longer target it, change
#     DOTNET_VERSION and IOS_TFM below; nothing in the source tree is pinned to
#     a runtime version, and the first script step prints the Xcode and workload
#     versions in use so a mismatch reads as a version pair rather than a
#     mysterious compiler error.
#
#   * MANUAL TRIGGER ONLY, same as the Flutter workflow and for the same reason.
#
# The .ipa this produces is UNSIGNED and must be run through
# tools/presign_trollstore_ipa.sh before TrollStore sees it. Skip that and
# TrollStore applies its own entitlements, which include get-task-allow, and the
# device silently regains a permanent +35 ios_get_task_allow floor that makes a
# clean baseline unobtainable.

workflows:
  dotnet-ios-unsigned:
    name: .NET iOS unsigned build (TrollStore device target)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      # PINNED, and it has to be. .NET for iOS does not accept a range: workload
      # 26.5.9004 demands Xcode 26.5 exactly, and refused the image's 26.6 with
      # "requires Xcode 26.5. The current version of Xcode is 26.6". There is no
      # iOS 26.6 binding published for any .NET version, so the newer Xcode is
      # simply ahead of the toolchain and pinning back is the only fix.
      #
      # When this needs moving: the rule is that the Microsoft.iOS.Sdk version
      # and the Xcode version match to the minor. Set this to whatever Xcode the
      # workload then asks for, and keep IOS_TFM on a runtime that has bindings
      # for it. If Codemagic has dropped this version, the build fails in the
      # prepare step and lists what the image does have.
      xcode: 26.5
      vars:
        DOTNET_VERSION: "9.0"
        IOS_TFM: "net9.0-ios"
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        DOTNET_NOLOGO: "1"
        PROJECT: "src/DeviceTrust.iOS.Harness/DeviceTrust.iOS.Harness.csproj"

    scripts:
      - name: Record the version pair this machine provides
        script: |
          set -euo pipefail
          # First and cheapest step. Every plausible failure of this workflow is
          # a disagreement between the image's Xcode and the .NET iOS bindings,
          # and that diagnosis is worth having before a 20-minute build rather
          # than after it.
          xcodebuild -version
          echo "--- iOS SDKs present ---"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true
          sw_vers

      - name: Install the .NET SDK and the ios workload
        script: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel "$DOTNET_VERSION" --install-dir "$HOME/.dotnet"
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet --version
          # No --skip-manifest-update: the manifest decides which Microsoft.iOS
          # binding version is used, and the current one is what pairs with the
          # image's Xcode. Print what was resolved, because that single line is
          # the answer to "which bindings did this actually build against".
          dotnet workload install ios
          dotnet workload list

          # Fail here rather than four minutes into the build. This exact
          # mismatch has already cost one run: restore and the shared library
          # both succeeded, and the version check fired afterwards, deep in a
          # targets file. The pairing is an equality, not a floor.
          SDK_PACK=$(ls -d "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.* 2>/dev/null | head -1)
          WANT=$(basename "$SDK_PACK" | sed 's/.*_//')
          HAVE=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1,2)
          echo "iOS workload wants Xcode $WANT; this image has $HAVE"
          if [ "$WANT" != "$HAVE" ]; then
            echo "MISMATCH. Set 'xcode: $WANT' in codemagic.yaml, or move IOS_TFM"
            echo "to a runtime whose bindings pair with Xcode $HAVE."
            exit 1
          fi

      - name: Verify the parts that can be checked without a device
        script: |
          set -euo pipefail
          export DOTNET_ROOT="$HOME/.dotnet"; export PATH="$DOTNET_ROOT:$PATH"
          # The platform-neutral tests include the Mach-O and entitlements
          # parsing the iOS collector depends on. Failing here is cheaper than
          # failing on the device.
          dotnet test --nologo -v q

      - name: Build the iOS app unsigned
        script: |
          set -euo pipefail
          export DOTNET_ROOT="$HOME/.dotnet"; export PATH="$DOTNET_ROOT:$PATH"
          # Device builds normally demand a signing identity and a provisioning
          # profile, both of which need a paid Apple Developer account. The
          # target is a TrollStore device, where the signature is applied later
          # and by something else, so signing is disabled outright rather than
          # faked.
          # DeviceTrustPlatforms narrows the shared Maui library to the one
          # framework this build wants. Without it, restoring that
          # cross-targeting project would also restore its net8.0-android
          # framework and demand the android workload: about a gigabyte, for an
          # output nobody here uses.
          dotnet publish "$PROJECT" \
            -f "$IOS_TFM" -c Release \
            -p:DeviceTrustIosTfm="$IOS_TFM" \
            -p:DeviceTrustPlatforms="$IOS_TFM" \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:ArchiveOnBuild=false

      - name: Package the .app into an unsigned .ipa
        script: |
          set -euo pipefail
          APP=$(find src/DeviceTrust.iOS.Harness/bin/Release -maxdepth 4 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "no .app produced; see the build log above"; exit 1; }
          echo "bundling $APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          ( cd build/ipa && zip -qry ../../devicetrust-dotnet-unsigned.ipa Payload )
          ls -lh devicetrust-dotnet-unsigned.ipa

      - name: Report what the build produced
        script: |
          set -euo pipefail
          APP=$(find src/DeviceTrust.iOS.Harness/bin/Release -maxdepth 4 -name '*.app' -type d | head -1)
          echo "--- bundle contents ---"
          ls -1 "$APP" | head -30
          echo "--- nested dylibs OUTSIDE Frameworks/ ---"
          # A dylib at the bundle root is the documented cause of a sideloaded
          # app that flashes and closes: signing tools walk Frameworks/ and
          # PlugIns/ and miss anything else, so it loads with an invalid
          # signature. A .NET bundle can carry several, so list them explicitly
          # rather than discovering it from a crash report.
          find "$APP" -maxdepth 1 -name '*.dylib' -print || true
          echo "--- declared minimum OS ---"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "--- entitlements currently embedded (expect none: unsigned) ---"
          codesign -d --entitlements :- "$APP" 2>&1 | head -20 || true

    artifacts:
      - devicetrust-dotnet-unsigned.ipa
      - src/DeviceTrust.iOS.Harness/bin/Release/**/*.app
